<!doctype html><meta charset="utf-8"><title>Render music</title>
<body style="background:#111;color:#ddd;font:14px monospace">
<pre id="log"></pre>
<script type="module">
import { Music } from "../js/music.js";
const log = s => document.getElementById("log").textContent += s + "\n";
function wav(buf) {
  const ch = buf.numberOfChannels, len = buf.length, rate = buf.sampleRate;
  const out = new DataView(new ArrayBuffer(44 + len * ch * 2));
  const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); out.setUint32(4, 36 + len * ch * 2, true); w(8, "WAVE"); w(12, "fmt ");
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true);
  out.setUint32(24, rate, true); out.setUint32(28, rate * ch * 2, true); out.setUint16(32, ch * 2, true);
  out.setUint16(34, 16, true); w(36, "data"); out.setUint32(40, len * ch * 2, true);
  const data = [...Array(ch)].map((_, c) => buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < len; i++) for (let c = 0; c < ch; c++) { const v = Math.max(-1, Math.min(1, data[c][i])); out.setInt16(o, v * 32767, true); o += 2; }
  return new Blob([out], { type: "audio/wav" });
}
window.renderTo = async (sceneName, opts) => {
  const scene = await (await fetch(`../scenes/${sceneName}.json`)).json();
  const buf = await Music.render(scene, opts);
  const d = buf.getChannelData(0);
  let peak = 0, sum = 0;
  for (const v of d) { peak = Math.max(peak, Math.abs(v)); sum += v * v; }
  const blob = wav(buf);
  window.lastWav = blob;
  return { seconds: buf.duration, peak: +peak.toFixed(3), rms: +Math.sqrt(sum / d.length).toFixed(4), bytes: blob.size };
};
log("ready");
</script>
